[tool.poetry]
name = "ai-ecommerce-platform"
version = "1.0.0"
description = "Enterprise Multi-Vendor E-Commerce Platform with Real-Time AI Recommendations"
authors = ["lakshmidurga250 <lakshmitageti@gmail.com>"]
readme = "README.md"
packages = [
    { include = "backend" },
    { include = "ai" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.110.0"
uvicorn = ">=0.28.0"
pydantic = ">=2.6.0"
pydantic-settings = ">=2.2.0"
sqlalchemy = ">=2.0.28"
alembic = ">=1.13.1"
python-jose = {extras = ["cryptography"], version = ">=3.3.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.4"}
bcrypt = ">=4.1.2"
python-multipart = ">=0.0.9"
websockets = ">=12.0"
httpx = ">=0.27.0"
prometheus-client = ">=0.20.0"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
scikit-learn = ">=1.4.0"
scipy = ">=1.12.0"
pytest = ">=8.0.0"
python-dateutil = ">=2.9.0"
typing-extensions = ">=4.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
